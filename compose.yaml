services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      LOG_LEVEL: warning
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
